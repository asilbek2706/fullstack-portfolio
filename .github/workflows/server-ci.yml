name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: true
      NODE_ENV: test
      LOG_LEVEL: silent
      MONGO_URI: mongodb://127.0.0.1:27017/portfolio_ci
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      CLIENT_URL: http://localhost:5173
      RECAPTCHA_SITE_KEY: ci-recaptcha-site-key
      RECAPTCHA_SECRET_KEY: ci-recaptcha-secret
      RECAPTCHA_ACTION: contact
      RECAPTCHA_HOSTNAME: localhost
      RECAPTCHA_MIN_SCORE: "0.5"
      TELEGRAM_BOT_TOKEN: ci-telegram-bot-token
      TELEGRAM_CHAT_ID: ci-telegram-chat
      WEBHOOK_SECRET_TOKEN: ci-webhook-secret
      IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/ci-test
      IMAGEKIT_PUBLIC_KEY: public_ci_test
      IMAGEKIT_PRIVATE_KEY: private_ci_test

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate code
        run: npm run validate

      - name: Audit dependencies
        run: npm audit --audit-level=high
